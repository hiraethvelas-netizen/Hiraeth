name: Validate Hiraeth

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, feature/home-banners-brand-palette]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run tests
        run: bun run test
      - name: Build production bundle
        if: ${{ !cancelled() }}
        run: bun run build
      - name: Check TypeScript
        if: ${{ !cancelled() }}
        run: bunx tsc --noEmit
      - name: Run ESLint (existing project debt is non-blocking)
        if: ${{ !cancelled() }}
        run: bun run lint
        continue-on-error: true

      - name: Diagnose published storefront and NFC route (public URLs only)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python3 - <<'PY'
          import socket, urllib.request, urllib.error
          for url in ["https://hiraeth-oficial.lovable.app/", "https://hiraeth-oficial.lovable.app/portal/o-mundo-de-magia", "https://id-preview--486adfc4-5da8-41d9-8d0f-7893dfde1510.lovable.app/"]:
            host = urllib.request.urlparse(url).hostname
            print("TEST:",url)
            try: print("DNS:",sorted(set(a[4][0] for a in socket.getaddrinfo(host,443))))
            except Exception as e: print("DNS ERROR",str(e)[:300])
            try:
              req = urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req,timeout=14) as response:
                body = response.read(6000).decode("utf8","replace")
                print("STATUS:",response.status,"FINAL URL:",response.url)
                print("TITLE:",body.partition("<title>")[2].partition("</title>")[0][:200])
                print("NOT_PUBLISHED:","not published" in body.lower())
            except urllib.error.HTTPError as e: print("HTTP ERROR:",e.code,"URL:",e.url)
            except Exception as e: print("HTTP ERROR:",type(e).__name__,str(e)[:400])
          PY

  publication-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check live storefront and NFC portal over public Internet
        shell: bash
        run: |
          for u in 'https://hiraeth-oficial.lovable.app/' 'https://hiraeth-oficial.lovable.app/portal/o-mundo-de-magia' 'https://486adfc4-5da8-41d9-8d0f-7893dfde1510.lovableproject.com/portal/o-mundo-de-magia' 'https://id-preview--486adfc4-5da8-41d9-8d0f-7893dfde1510.lovable.app/'; do
            echo "CHECK $u"
            curl --location --max-time 18 --silent --show-error -o /tmp/hiraeth-pub-body -w 'HTTP_CODE %{http_code} FINAL_URL %{url_effective} REMOTE_IP %{remote_ip} CONTENT_TYPE %{content_type}\n' "$u" || echo "CURL_FAILED"
            grep -oEi '<title>[^<]{0,140}</title>|this site is not published|not published' /tmp/hiraeth-pub-body 2>/dev/null | head -c 500 || true
            echo ""
          done

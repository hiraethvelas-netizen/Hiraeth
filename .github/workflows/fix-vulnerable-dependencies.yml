name: Update vulnerable dependencies (staging branch only)

on:
  push:
    branches: [fix/security-signup-house-nfc-20261113]
    paths:
      - .github/workflows/fix-vulnerable-dependencies.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'hiraethvelas-netizen/Hiraeth' && github.ref == 'refs/heads/fix/security-signup-house-nfc-20261113'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proposed security branch
        uses: actions/checkout@v4
        with:
          ref: fix/security-signup-house-nfc-20261113
          persist-credentials: true
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Update Vite, Vitest, Zod and compatible transitive dependencies
        run: |
          bun update --latest vite vitest zod
          bun update
      - name: Run all application tests
        run: bun run test
      - name: Build production bundle
        run: bun run build
      - name: Check TypeScript
        run: bunx tsc --noEmit
      - name: Audit repaired dependency tree
        run: |
          bun audit --json > bun-audit-after.json || true
          bun -e 'const fs=require("node:fs");const j=JSON.parse(fs.readFileSync("bun-audit-after.json","utf8"));console.log("Remaining advisories by package:",Object.fromEntries(Object.entries(j).map(([k,v])=>[k,v.length])));'
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: hiraeth-dependency-audit-after
          path: bun-audit-after.json
      - name: Commit updates only after successful tests and typecheck
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          if git diff --staged --quiet; then echo "Nothing to update"; exit 0; fi
          git commit -m "fix(deps): update security-vulnerable packages after CI validation"
          git push origin HEAD:fix/security-signup-house-nfc-20261113
